<div class="mt-4 p-5">
  <h2 class="fw-bold">Bienvenido a tu dashboard</h2>
  <span class="text-muted">
    Gestiona tus trabajos, aplicaciones y perfil desde aquí
  </span>
</div>

<div class="d-flex justify-content-center gap-4 flex-wrap">
  <app-dashboard-card
    icon="bi-plus-square"
    title="Publicar"
    description="Crea una nueva oferta de trabajo"
    txtbtn="Publicar"
    link="/publicar-trabajo"
  ></app-dashboard-card>

  <app-dashboard-card
    icon="bi-suitcase-lg"
    title="Buscar Trabajos"
    description="Encuentra oportunidades de trabajo"
    txtbtn="Buscar"
    link="/Lista"
  ></app-dashboard-card>

  <app-dashboard-card
    icon="bi-person-fill"
    title="Mi perfil"
    description="Actualiza tu información personal"
    txtbtn="Ver Perfil"
    link="/profile"
  ></app-dashboard-card>

  <app-dashboard-card
    icon="bi-file-earmark-person-fill"
    title="Mis aplicaciones"
    description="Revisa el estado de tus publicaciones"
    txtbtn="Ver"
    link="/solicitud-trabajo"
  ></app-dashboard-card>
</div>

<div class="card mt-5 p-4 shadow mx-auto" style="max-width: 800px;">
  <h5 class="fw-bold">Trabajos recientes</h5>
  <span class="text-muted">Tus últimas publicaciones de trabajo</span>

  <div class="mt-3">
    @for (p of posts; track $index) {
      <div
        class="job-item d-flex justify-content-between align-items-center p-3 rounded-3 mb-3"
        [routerLink]="['/editarTrabajo', p.id]"
      >
        <div>
          <h6 class="m-0">{{ p.title }}</h6>
          <small class="text-muted">Publicado {{ p.createdAt }}</small>
        </div>

        <span class="badge rounded-pill bg-secondary text-dark">
          {{ p.status ? 'Activo' : 'Inactivo' }}
        </span>
      </div>
    }
  </div>
</div>

<br>
