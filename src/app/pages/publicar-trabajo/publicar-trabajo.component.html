<div class="publicar-trabajo-page">

  <main class="form-card">
    <h2>Crear nueva oferta de trabajo</h2>
    <p class="descripcion">
      Completa la información para publicar tu oferta de trabajo informal.
    </p>

    <!-- MENSAJES -->
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success">Trabajo publicado correctamente 🎉</div>

    <form (ngSubmit)="publicarTrabajo()">

      <div class="campo">
        <label for="titulo">Título del trabajo *</label>
        <input id="titulo" type="text" [(ngModel)]="titulo" name="titulo"
               placeholder="Ej: Limpieza de casa, Cuidado de mascotas..." />
      </div>

      <div class="campo">
        <label for="categoria">Categoría *</label>
        <select id="categoria" [(ngModel)]="categoria_id" name="categoria">
          <option [ngValue]="null">Selecciona una categoría</option>
          <option [ngValue]="1">Limpieza</option>
          <option [ngValue]="2">Cuidado de mascotas</option>
          <option [ngValue]="3">Jardinería</option>
        </select>
      </div>

      <div class="campo">
        <label for="descripcion">Descripción *</label>
        <textarea id="descripcion" [(ngModel)]="descripcion" name="descripcion"
                  placeholder="Describe detalladamente el trabajo que necesitas realizar..."></textarea>
      </div>

      <div class="fila">
        <div class="campo mitad">
          <label for="pago">Pago (MXN) *</label>
          <input id="pago" type="number" [(ngModel)]="pago" name="pago" placeholder="5000" />
        </div>

        <div class="campo mitad">
          <label for="fecha">Fecha Límite *</label>
          <input id="fecha" type="date" [(ngModel)]="deadline" name="deadline" />
        </div>
      </div>

      <div class="campo">
        <label for="ubicacion">Ubicación</label>
        <input id="ubicacion" type="text" [(ngModel)]="ubicacion" name="ubicacion"
               placeholder="Ej: Centro, Norte, Sur de la ciudad..." />
      </div>

      <button type="submit" class="boton" [disabled]="loading">
        {{ loading ? 'Publicando...' : 'Publicar trabajo' }}
      </button>
    </form>
  </main>
</div>
